<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moving, Sparkling, and Blinking Image</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: pink; /* Dark background makes the sparkle pop */
      margin: 0;
    }

    .image-wrapper {
      position: relative;
      display: inline-block;
      /* Combines moving, sparkling, and blinking animations */
      animation: 
        floatMove 3s ease-in-out infinite,
        sparkleGlow 1.5s alternate infinite,
        smoothBlink 2s infinite;
    }

    .image-wrapper img {
      width: 700px;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    /* Decorative star sparkles using pseudo-elements */
    .image-wrapper::before,
    .image-wrapper::after {
      content: "✦";
      position: absolute;
      color: #fff700;
      font-size: 28px;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff00de;
      animation: twinkle 1s alternate infinite;
    }

    .image-wrapper::before {
      top: -15px;
      left: -15px;
    }

    .image-wrapper::after {
      bottom: -15px;
      right: -15px;
      animation-delay: 0.5s;
    }

    /* 1. Moving Animation (Floating up and down) */
    @keyframes floatMove {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    /* 2. Sparkling Animation (Glowing brightness and drop-shadow) */
    @keyframes sparkleGlow {
      0% {
        filter: brightness(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
      }
      100% {
        filter: brightness(1.3) drop-shadow(0 0 20px rgba(255, 215, 0, 0.9));
      }
    }

    /* 3. Blinking Animation (Fading opacity) */
    @keyframes smoothBlink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    /* Star Twinkle Animation */
    @keyframes twinkle {
      0% {
        transform: scale(0.8) rotate(0deg);
        opacity: 0.4;
      }
      100% {
        transform: scale(1.3) rotate(25deg);
        opacity: 1;
      }
    }
  </style>
</head>
